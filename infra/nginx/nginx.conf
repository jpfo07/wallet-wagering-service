worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # DNS interno do Docker. Reavaliado a cada 5s: uma réplica que reinicia com outro IP
  # entra de volta no pool sem reiniciar o nginx.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream api {
    zone api_upstream 64k;
    # "api" resolve para os IPs de todas as réplicas; "resolve" acompanha mudanças (nginx >= 1.27.3).
    server api:3000 resolve;
    keepalive 32;
  }

  # Log de acesso em JSON, sem corpo nem headers de autenticação.
  log_format json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,'
    '"upstream":"$upstream_addr","upstreamStatus":"$upstream_status",'
    '"requestTime":$request_time,"correlationId":"$http_x_correlation_id"}';
  access_log /dev/stdout json;

  server {
    listen 80;

    # Saúde do próprio proxy (não depende das APIs).
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      # Falha de conexão/timeout tenta a próxima réplica, mas só para métodos idempotentes:
      # o nginx nunca reenvia POST (sem "non_idempotent"). Retry de POST é do provedor,
      # protegido pela idempotência persistente.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;

      # Torna visível qual réplica atendeu.
      add_header X-Upstream-Addr $upstream_addr always;
    }
  }
}
