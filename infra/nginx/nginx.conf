worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # DNS interno do Docker, reavaliado a cada 1s: uma réplica recriada (outro IP) entra no pool, e uma
  # parada sai dele, em até 1s, sem reiniciar o nginx.
  resolver 127.0.0.11 valid=1s ipv6=off;

  upstream api {
    zone api_upstream 64k;
    # "api" resolve para os IPs de todas as réplicas; "resolve" acompanha mudanças (nginx >= 1.27.3).
    # O nginx open source não tem health check ativo: o DNS pode listar um IP que ainda não abriu a
    # porta (boot) ou que já não existe (réplica parada). Uma falha de conexão tira o IP do pool por
    # 3s, em vez de cada requisição pagar a tentativa de novo.
    server api:3000 resolve max_fails=1 fail_timeout=3s;
    keepalive 32;
    # Menor que a janela de drain da API (HTTP_SHUTDOWN_DRAIN_MS = 2500): quando uma réplica fecha a
    # porta, o nginx já descartou todo socket ocioso para ela e nunca reusa um socket que ela fechou.
    keepalive_timeout 2s;
  }

  # Log de acesso em JSON, sem corpo nem headers de autenticação.
  log_format json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,'
    '"upstream":"$upstream_addr","upstreamStatus":"$upstream_status",'
    '"requestTime":$request_time,"correlationId":"$http_x_correlation_id"}';
  access_log /dev/stdout json;

  server {
    listen 80;

    # Saúde do próprio proxy (não depende das APIs).
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Um IP morto (container parado) não responde ao SYN: sem este limite cada tentativa nele
      # custaria o timeout inteiro.
      proxy_connect_timeout 1s;
      proxy_read_timeout 30s;
      # Falha de conexão/timeout tenta a próxima réplica. Recusa de conexão (nada foi enviado) vale
      # para qualquer método; depois que a requisição foi enviada, o nginx só reenvia métodos
      # idempotentes (sem "non_idempotent"): retry de POST é do provedor, protegido pela
      # idempotência persistente.
      proxy_next_upstream error timeout http_502 http_503;
      # Durante uma troca de réplicas o DNS pode listar mais IPs mortos do que um limite fixo de
      # tentativas cobriria (com 3, "502, 502, 502" chegava ao cliente). Tenta todos, dentro de um
      # prazo.
      proxy_next_upstream_tries 0;
      proxy_next_upstream_timeout 5s;

      # Torna visível qual réplica atendeu.
      add_header X-Upstream-Addr $upstream_addr always;
    }
  }
}
