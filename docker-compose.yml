# Stack de desenvolvimento/demonstração: 3 APIs atrás do nginx e workers replicados.
# Uso: docker compose up -d --build --wait   (única porta da API: http://localhost:8080)
name: wallet-wagering

x-app-env: &app-env
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: wallet
  DATABASE_USER: wallet
  DATABASE_PASSWORD: wallet
  DATABASE_POOL_MAX: "10"
  DATABASE_LOCK_TIMEOUT_MS: "5000"
  DATABASE_STATEMENT_TIMEOUT_MS: "15000"
  DATABASE_TRANSIENT_RETRY_ATTEMPTS: "3"
  DATABASE_TRANSIENT_RETRY_BASE_MS: "50"
  DATABASE_TRANSIENT_RETRY_MAX_MS: "400"
  PENDING_REFERENCE_BACKOFF_BASE_MS: "1000"
  PENDING_REFERENCE_BACKOFF_MAX_MS: "60000"
  PENDING_REFERENCE_TTL_MS: "900000"
  SQS_ENDPOINT: http://localstack:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_WAGER_QUEUE_NAME: wager-transactions.fifo
  SQS_WAGER_DLQ_NAME: wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE_NAME: wallet-events.fifo
  HTTP_PORT: "3000"
  WORKER_HEALTH_PORT: "9100"

# Uma única imagem para todos os processos; cada serviço escolhe o comando.
x-app: &app
  image: wallet-wagering-service:dev
  build: .
  environment: *app-env
  restart: unless-stopped
  # tini como PID 1 repassa os sinais; o handler de SIGTERM é instalado antes do boot (ver ARCHITECTURE.md).
  init: true
  stop_grace_period: 15s
  depends_on:
    migrations:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "bun", "src/entrypoints/healthcheck.ts", "9100"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  postgres:
    image: postgres:18.6-alpine@sha256:3b0ef735388b2cb097fc29b8bb421d86d57d0ddbe7aa1fbd6493e06d65028503
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    # 3 APIs + 6 workers com pool de 10 = 90 conexões, mais folga para migrations e ferramentas.
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      # PostgreSQL 18+: o VOLUME da imagem é /var/lib/postgresql (PGDATA = /var/lib/postgresql/18/docker).
      - pgdata:/var/lib/postgresql
    # Exposto só no loopback, para ferramentas locais. A API só é acessível pelo nginx.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    # Última imagem community (Apache 2.0); fixada por tag + digest.
    image: localstack/localstack:4.14.0@sha256:75ba7a4bda54a3020019fba23e99c61bbff7dbf23eea12919e5b75b15c6f03f2
    environment:
      SERVICES: sqs
      # No 4.14.0, "off" gera http://<LOCALSTACK_HOST>/<conta>/<fila> ("path" acrescenta /queue/<região>).
      SQS_ENDPOINT_STRATEGY: "off"
      LOCALSTACK_HOST: localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      SQS_MAX_RECEIVE_COUNT: "5"
    # O shutdown costuma levar 2-3 s, mas com a stack inteira no ar já passou dos 10 s padrão e levou
    # SIGKILL (137). Folga para sair com 0; um travamento real continua aparecendo como 137 no smoke.
    stop_grace_period: 30s
    volumes:
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      # Saudável só quando os scripts de init terminaram (filas criadas).
      test:
        [
          "CMD-SHELL",
          'curl -fsS http://localhost:4566/_localstack/init/ready | grep -q ''"completed": true''',
        ]
      interval: 2s
      timeout: 3s
      retries: 60

  # Roda uma vez, antes de qualquer aplicação: as 3 APIs nunca disputam migrations no boot.
  migrations:
    <<: *app
    command: ["bun", "run", "src/entrypoints/migrate.ts", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["bun", "run", "src/entrypoints/api.ts"]
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "bun", "src/entrypoints/healthcheck.ts", "3000"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.30.6-alpine@sha256:84ed8c0dd296c188bfc24ed506f46589e9285fb0b11cf3a04d91d524d3067e11
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 12

  sqs-consumer:
    <<: *app
    command: ["bun", "run", "src/entrypoints/sqs-consumer.ts"]
    deploy:
      replicas: 2
    healthcheck: *worker-healthcheck

  outbox-publisher:
    <<: *app
    command: ["bun", "run", "src/entrypoints/outbox-publisher.ts"]
    deploy:
      replicas: 2
    healthcheck: *worker-healthcheck

  pending-reference-worker:
    <<: *app
    command: ["bun", "run", "src/entrypoints/pending-reference-worker.ts"]
    deploy:
      replicas: 2
    healthcheck: *worker-healthcheck

volumes:
  pgdata:
